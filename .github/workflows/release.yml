name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    strategy:
      # One platform failing should not cancel the others: a partial release
      # with two of three binaries is far more useful than none.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
          - os: windows-latest
            rid: win-x64
            archive: zip
          - os: macos-latest
            rid: osx-arm64
            archive: tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        shell: bash
        run: |
          dotnet publish dotnet/src/CloakHub.App/CloakHub.App.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -o out

          # Debug symbols are not part of a release download and add ~89 MB
          # on Windows, where SkiaSharp ships a .pdb next to the binary.
          rm -f out/*.pdb

      - name: Package
        shell: bash
        run: |
          cd out
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a ../CloakBrowserHub-${{ matrix.rid }}.zip .
          else
            # On macOS the runtime leaves the native Avalonia/Skia/HarfBuzz
            # dylibs beside the executable rather than inside it, so the whole
            # directory has to ship or the app cannot start. Linux embeds them.
            chmod +x CloakBrowserHub
            tar -czf ../CloakBrowserHub-${{ matrix.rid }}.tar.gz .
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: CloakBrowserHub-${{ matrix.rid }}.*
