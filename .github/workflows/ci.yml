name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('dotnet/**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore dotnet/CloakBrowserHub.sln

      # TreatWarningsAsErrors is on in the projects; -warnaserror keeps the
      # bar in CI too, so warnings cannot accumulate unnoticed.
      - name: Build
        run: dotnet build dotnet/CloakBrowserHub.sln -c Release --no-restore -warnaserror

      # No display needed: all logic lives in CloakHub.Core, which has no UI
      # dependency, so a headless runner covers the whole suite.
      - name: Test
        run: dotnet test dotnet/CloakBrowserHub.sln -c Release --no-build --verbosity normal
