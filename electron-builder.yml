appId: dev.cloakbrowser.hub
productName: CloakBrowser Hub
copyright: Copyright © 2026 CloakBrowser Hub

directories:
  output: release/${version}
  buildResources: build

files:
  - dist/**/*
  - '!**/{.eslintrc,.editorconfig,.prettierrc,tsconfig.json,vitest.config.ts}'
  - '!**/*.map'

asarUnpack:
  - resources/**

# The stealth Chromium binary is downloaded at runtime into ~/.cloakbrowser,
# so it is deliberately NOT bundled here — installers stay small (~90 MB).
npmRebuild: false

linux:
  target:
    - AppImage
    - deb
    - tar.gz
  category: Network
  maintainer: hub@cloakbrowser.dev
  synopsis: Anti-detect browser profile manager
  desktop:
    entry:
      Name: CloakBrowser Hub
      Comment: Anti-detect browser profile manager
      Categories: Network;WebBrowser;

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSAppleEventsUsageDescription: Needed to launch stealth browser sessions.

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CloakBrowser Hub
