<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      A strict CSP in the shipped page: the renderer only ever executes code that
      was bundled with the app, so allowing anything else is pure downside.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloakBrowser Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
